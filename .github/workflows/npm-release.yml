name: CLI npm release

on:
  push:
    tags:
      - "v*"
    branches:
      - "staging/v*.*.*-*"

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: Validate and package CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Validate ref version
        id: package_version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          ref_name="${GITHUB_REF_NAME}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${ref_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must match vX.Y.Z."
              exit 1
            fi

            expected="v${version}"
            if [[ "${ref_name}" != "${expected}" ]]; then
              echo "::error::Release tag ${ref_name} must match cli/package.json version ${version}."
              exit 1
            fi
          elif [[ "${ref_name}" == staging/v* ]]; then
            if [[ ! "${ref_name}" =~ ^staging/v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
              echo "::error::Staging branches must match staging/vX.Y.Z-*."
              exit 1
            fi

            if [[ "${ref_name}" != staging/v${version}-* ]]; then
              echo "::error::Staging branch ${ref_name} must use cli/package.json version ${version}."
              exit 1
            fi
          else
            echo "::error::Unsupported ref ${GITHUB_REF_TYPE}/${ref_name}."
            exit 1
          fi
        working-directory: cli

      - name: Typecheck
        run: npm run typecheck
        working-directory: cli

      - name: Build
        run: npm run build
        working-directory: cli

      - name: Test
        run: npm test
        working-directory: cli

      - name: Pack dry run
        run: npm run pack:dry-run
        working-directory: cli

      - name: Publish to npm
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        run: npm publish --access public
        working-directory: cli
